# GHCR 이미지 기반 프로덕션 배포 (NAS Container Manager)
# 이미지는 로컬에서 `./manage.sh ghcr:push`로 빌드·푸시하고,
# NAS에서 `./deploy.sh update`로 이 파일을 사용해 배포한다.

services:
  nas-photo:
    image: ghcr.io/${GHCR_USERNAME:-hyunjoonkwak}/nas-photo:${IMAGE_TAG:-latest}
    container_name: nas-photo
    # 소유자 본인 uid로 실행 — 1차 구역 원본(711, 소유자만 read)을 읽어 썸네일을
    # 직접 리사이즈하기 위함(@eaDir 썸네일 없는 폴더). /data는 이 uid 소유여야 함.
    # root 실행: ① homes 원본(0711, 소유자만 read) 썸네일·EXIF 읽기 ② 공용(team)
    # 공유가 ACL(mode 000)로 잠겨 있어 소유자 uid로도 못 읽음 → 촬영일 교정의
    # EXIF 감지를 위해 root 필요(사용자 승인 2026-07-09). 파일 이동/삭제는 계속
    # DSM API로만. 마운트 쓰기는 촬영일 교정(capture_fix)에서만.
    user: "0:0"
    ports:
      - "9800:9800"
    volumes:
      - ./data:/data # SQLite (세션/작업로그/사진 해시 캐시)
      # homes 마운트: 썸네일·EXIF 직접 읽기용. 최종 curation 운영은 ro가 기본이며,
      # legacy/drain 롤백 때만 .env의 THUMB_HOMES_MODE=rw로 명시해 쓰기를 연다.
      - ${THUMB_HOMES_HOST:-/volume1/homes}:/photovol/homes:${THUMB_HOMES_MODE:-ro}
      # 공용(team) 공유 — 촬영일 교정 시 EXIF 읽기용(읽기전용). 파일 수정은 안 함
      # (공용은 Synology set API로 교정, 파일은 못 씀).
      - ${THUMB_PHOTO_HOST:-/volume1/photo}:/photovol/photo:ro
    environment:
      - TZ=Asia/Seoul
      - THUMB_MOUNT_HOMES=/photovol/homes
      - THUMB_MOUNT_TEAM=/photovol/photo
      # DSM 연결 (자격증명은 넣지 않음 — 로그인 화면에서 입력)
      - DSM_BASE_URL=${DSM_BASE_URL:-https://192.168.0.10}
      - DSM_PORT=${DSM_PORT:-5001}
      - DSM_VERIFY_TLS=${DSM_VERIFY_TLS:-false}
      - DSM_TIMEOUT_SECONDS=${DSM_TIMEOUT_SECONDS:-30}
      # 프론트 정적 서빙 + DB 경로 (이미지 내부 기본값 유지)
      - FRONTEND_DIST=/app/static
      - SQLITE_PATH=/data/app.db
      # 운영 도메인은 HTTPS(NPM) 전용 — 세션 쿠키의 평문 전송 금지.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-28800}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_WINDOW_SECONDS=${LOGIN_WINDOW_SECONDS:-600}
      - LOGIN_IP_MAX_ATTEMPTS=${LOGIN_IP_MAX_ATTEMPTS:-20}
      # NPM이 덮어쓰는 X-Real-IP를 IP별 로그인 제한에 사용.
      - LOGIN_TRUST_PROXY_HEADERS=${LOGIN_TRUST_PROXY_HEADERS:-true}
      # 운영에서는 반드시 false (실 NAS 연동)
      - MOCK_MODE=${MOCK_MODE:-false}
      # Gallery는 감상·검색·다운로드·Synology 논리 큐레이션만 담당한다.
      # 긴급 롤백 때만 GALLERY_WRITE_MODE=drain과 homes=rw를 함께 사용한다.
      - GALLERY_WRITE_MODE=${GALLERY_WRITE_MODE:-curation}
      - GALLERY_LEGACY_DATE_REPAIR=${GALLERY_LEGACY_DATE_REPAIR:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9800/api/health', timeout=3).status==200 else 1)"
      # NAS가 바쁠 때 컨테이너 내 python 프로세스 spawn이 5s를 넘어 오탐(unhealthy)이
      # 나던 것 완화 — 엔드포인트 자체는 1ms.
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    restart: unless-stopped
