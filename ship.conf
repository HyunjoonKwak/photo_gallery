# ship 스킬 배포 매핑 (bash ~/.claude/skills/ship/ship.sh)
#
# 저장소·로컬 폴더는 photo_gallery 로 바뀌었지만 NAS 배포 경로와 이미지·컨테이너
# 이름은 옛 이름(nas_photo / nas-photo) 그대로다. 맞추면 GHCR 패키지 이력이
# 끊기고 ./data(SQLite — 세션·작업로그·사진 해시)가 새 경로로 갈라진다.
# 그래서 이름은 두고 두 이름을 여기서 잇는다. (ECOSYSTEM.md 7절)
#
# 이 파일이 없으면 ship 은 규칙대로 /volume1/code_work/photo_gallery 를 찾아
# 빈 디렉터리를 만들고 .env 없이 배포한다 — 반드시 함께 커밋해 둘 것.
NAS_DIR=/volume1/code_work/nas_photo
VERIFY_FILTER=nas-photo
